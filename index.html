    <meta property="og:title" content="दुकान साथी ERP - Billing & Stock" />
    <meta property="og:description" content="Smart Billing, Inventory Stock Management, Udhar Khata & POS ERP for retail shops and kirana businesses." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root">
      <div id="app-preloader" style="position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ffffff;padding:20px;text-align:center;z-index:99999;">
        <div style="width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#2563eb,#4f46e5);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(37,99,235,0.4);margin-bottom:16px;">
          <svg style="width:34px;height:34px;fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24">
            <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
            <path d="M12 18h.01"/>
          </svg>
        </div>
        <h1 style="font-size:20px;font-weight:700;margin:0 0 4px 0;letter-spacing:-0.02em;color:#ffffff;">दुकान साथी ERP</h1>
        <p style="font-size:12px;color:#94a3b8;margin:0 0 24px 0;">स्मार्ट बिलिंग व इन्वेंटरी</p>
        <div style="width:32px;height:32px;border:3px solid rgba(59,130,246,0.2);border-top-color:#3b82f6;border-radius:50%;animation:preloader-spin 0.8s linear infinite;"></div>
        <p style="font-size:11px;color:#64748b;margin:12px 0 0 0;">लोड हो रहा है...</p>

        <div id="preloader-retry" style="display:none;margin-top:20px;max-width:320px;">
          <p style="font-size:12px;color:#fca5a5;margin-bottom:8px;line-height:1.4;">
            अगर लोड होने में समय लग रहा है, तो नीचे दिए गए विकल्पों का उपयोग करें:
          </p>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button onclick="window.location.reload()" style="background:#2563eb;color:#ffffff;border:none;padding:10px 18px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;">
              🔄 पेज रिफ्रेश करें (Reload)
            </button>
            <a href="https://aistudio.google.com/applet-auth-bridge?applet_id=b13fa8bf-bec7-43f9-96f8-32e4ab0435d2&return_url=https%3A%2F%2Fais-dev-c4thstpjkud4lxqd2fkm26-584270155073.asia-east1.run.app%2F" style="display:inline-block;background:#334155;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;">
              🔑 Google लॉगिन से अनलॉक करें
            </a>
          </div>
          <p style="font-size:10px;color:#94a3b8;margin-top:10px;line-height:1.4;">
            💡 <strong>पक्का 24/7 समाधान:</strong> AI Studio में ऊपर दाईं ओर <strong>"Share"</strong> बटन दबाकर पब्लिक लिंक बनाएं ताकि बिना लॉगिन के सीधे खुले।
          </p>
        </div>
        <style>
          @keyframes preloader-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var retry = document.getElementById('preloader-retry');
        if (retry) retry.style.display = 'block';
      }, 3500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
