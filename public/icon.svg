<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Smartphone Frame in center -->
  <rect x="156" y="86" width="200" height="340" rx="36" fill="url(#accentGrad)" stroke="#60a5fa" stroke-width="8"/>
  <rect x="176" y="126" width="160" height="240" rx="16" fill="#0f172a"/>
  
  <!-- Speaker notch -->
  <line x1="226" y1="106" x2="286" y2="106" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <!-- Home indicator line -->
  <line x1="236" y1="396" x2="276" y2="396" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>

  <!-- Inventory / Box inside screen -->
  <path d="M216 190 L256 166 L296 190 L256 214 Z" fill="#60a5fa"/>
  <path d="M216 194 L256 218 L256 266 L216 242 Z" fill="#3b82f6"/>
  <path d="M296 194 L256 218 L256 266 L296 242 Z" fill="#2563eb"/>
  
  <!-- Checkmark badge -->
  <circle cx="286" cy="276" r="26" fill="#10b981"/>
  <path d="M276 276 L283 283 L298 268" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
